# Production stack for a single server.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d                      # app on http://localhost:8080
#   docker compose --profile tunnel up -d     # + Cloudflare Tunnel (no open ports)
name: tbn

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbn
      POSTGRES_DB: tbn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbn -d tbn"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published on the host: only the app container can reach it.

  app:
    image: ${TBN_IMAGE:-ghcr.io/OWNER/tbn-manager:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tbn:${POSTGRES_PASSWORD}@db:5432/tbn
      FILES_DIR: /data/files
    volumes:
      - app-files:/data/files
    # Bound to localhost only. Remote access goes through the tunnel.
    ports:
      - "127.0.0.1:8080:8080"

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - app

  # Nightly database dump + uploaded files, kept 14 days in ./backups.
  # Copy ./backups off the server (see docs/OPERATIONS.md) — a backup on the same disk is not a backup.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: tbn
      PGDATABASE: tbn
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: 14
    volumes:
      - ./backups:/backups
      - app-files:/files:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /backup.sh; sleep 86400; done"]

volumes:
  db-data:
  app-files:
