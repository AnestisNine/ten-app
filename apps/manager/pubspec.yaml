name: tbn_manager
description: TBN Manager — internal app of The Bonnie Nettles
publish_to: "none"
version: 0.15.1+43

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  excel: ^4.0.6
  web: ^1.0.0
  shared_preferences: ^2.3.3
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
