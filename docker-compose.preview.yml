# Local preview with demo data — NOT for real data (the secrets below are public).
#   docker compose -f docker-compose.preview.yml up --build
# then open http://localhost:8080  (users: member@tbn.local, admin@tbn.local, ... password: tbn-preview)
#
# Share a temporary public link (works while this computer and the command are running):
#   docker compose -f docker-compose.preview.yml --profile share up --build
# and look for the https://….trycloudflare.com address in the output.
name: tbn-preview

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tbn
      POSTGRES_DB: tbn
      POSTGRES_PASSWORD: preview
    volumes:
      - preview-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbn -d tbn"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tbn:preview@db:5432/tbn
      APP_URL: http://localhost:8080
      # Allows signing in through a temporary Cloudflare quick-tunnel address (profile "share").
      TRUSTED_ORIGINS: https://*.trycloudflare.com
      AUTH_SECRET: preview-only-secret-do-not-use-for-real-data-0123456789
      DATA_ENCRYPTION_KEY: cHJldmlldy1vbmx5LWtleS1ub3QtZm9yLXJlYWwtdXM=
      SEED_PASSWORD: tbn-preview
      ALLOW_DEMO_SEED: "1"
      # Preview only: admin/manager can work without setting up 2FA. Always on in production.
      REQUIRE_TWO_FACTOR: "false"
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js --if-empty && node dist/server.js"]
    ports:
      - "127.0.0.1:8080:8080"

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["share"]
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app

volumes:
  preview-db:
